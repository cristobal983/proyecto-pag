<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Nike Air Max Plus - Detalle</title>
  <link rel="stylesheet" href="../styles/bulma.css">
  <link rel="stylesheet" href="../styles/estilos.css">
</head>
<body>
  <header class="section pb-2">
    <div id="header-container"></div>
  </header>

  <section class="section">
    <div class="container">
      <div class="columns">
        
        <!-- 1. Miniaturas (Columna Izquierda) -->
        <div class="column is-1 is-hidden-mobile">
          <figure class="image is-64x64 mb-2">
            <img src="../images/imagen1.webp" class="is-rounded" style="border: 1px solid #000;">
          </figure>
          <figure class="image is-64x64 mb-2">
            <img src="../images/imagen2.webp">
          </figure>
          <figure class="image is-64x64 mb-2">
            <img src="../images/chaos.webp">
          </figure>
        </div>

        <!-- 2. Imagen Principal Destacada (Centro) -->
        <div class="column is-6">
          <figure class="image is-4by3">
            <img src="../images/imagen1.webp" alt="Nike Air Max Plus">
          </figure>
        </div>

        <!-- 3. Panel de Tallas y Selección (Columna Derecha) -->
        <div class="column is-5">
          <h2 class="title is-4 mb-2">Selecciona tu talla</h2>
          <a href="#" class="has-text-grey is-size-7 is-pulled-right mb-4">Guía de tallas</a>

          <!-- Botones de opción de medida -->
          <div class="buttons field has-addons mb-4">
            <button class="button is-black is-fullwidth">Saber mi talla</button>
            <button class="button is-outlined is-fullwidth">Pruébatelo</button>
          </div>

          <p class="is-size-7 has-text-grey mb-4">
            La horma es ajustada, te recomendamos pedir media talla más.
          </p>

          <!-- Rejilla de Tallas -->
          <div class="columns is-multiline is-mobile">
            <div class="column is-6">
              <button class="button is-fullwidth is-light" disabled>
                <div>
                  <p class="is-size-7" style="text-decoration: line-through;">H 6 / M 7.5</p>
                  <p class="is-size-7 has-text-grey">Ver similares</p>
                </div>
              </button>
            </div>
            <div class="column is-6">
              <button class="button is-fullwidth is-outlined">
                <div>
                  <p class="is-size-7">H 8.5 / M 10</p>
                </div>
              </button>
            </div>
            <div class="column is-6">
              <button class="button is-fullwidth is-light" disabled>
                <div>
                  <p class="is-size-7" style="text-decoration: line-through;">H 9 / M 10.5</p>
                  <p class="is-size-7 has-text-grey">Ver similares</p>
                </div>
              </button>
            </div>
            <div class="column is-6">
              <button class="button is-fullwidth is-light" disabled>
                <div>
                  <p class="is-size-7" style="text-decoration: line-through;">H 10 / M 11.5</p>
                  <p class="is-size-7 has-text-grey">Ver similares</p>
                </div>
              </button>
            </div>
          </div>

        </div>
      </div>
    </div>
  </section>

  <div id="footer-container"></div>

  <script src="../scripts/header.js"></script>
  <script src="../scripts/footer.js"></script>
</body>
</html>
