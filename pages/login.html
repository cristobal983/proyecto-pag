<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Sneakers Store</title>
    <link rel="stylesheet" href="../styles/bulma.css">
    <link rel="stylesheet" href="../styles/estilos.css">
</head>

<body>

    <header class="section py-4">
        <div id="header-container"></div>
        <div class="mt-4">
            <h1 class="title is-4 has-text-centered has-text-dark">
                ¡HOLA DE NUEVO!
            </h1>
            <p class="subtitle is-6 has-text-centered has-text-grey">
                Ingresa a tu cuenta para gestionar tus pedidos
            </p>
        </div>
    </header>

    <main class="container mt-4">
        <div class="columns is-centered">
            <div class="column is-4-desktop is-6-tablet">
                
                <form id="formLogin" class="box p-5" novalidate>
                    <div class="field">
                        <label class="label" for="loginEmail">Correo Electrónico</label>
                        <div class="control">
                            <input class="input" type="email" id="loginEmail" name="email"
                                placeholder="ejemplo@correo.com" autocomplete="email">
                        </div>
                        <p class="help is-danger is-hidden" id="err-login-email">
                            Ingrese un formato de correo electrónico válido.
                        </p>
                    </div>

                    <div class="field">
                        <label class="label" for="loginPassword">Contraseña</label>
                        <div class="control">
                            <input class="input" type="password" id="loginPassword" name="password"
                                placeholder="••••••••" autocomplete="current-password">
                        </div>
                        <p class="help is-danger is-hidden" id="err-login-password">
                            La contraseña no puede estar vacía y debe tener al menos 6 caracteres.
                        </p>
                    </div>

                    <div class="field mt-5">
                        <div class="control">
                            <button type="submit" class="button is-dark is-fullwidth">
                                <strong>Iniciar Sesión</strong>
                            </button>
                        </div>
                    </div>

                    <div class="has-text-centered mt-4">
                        <p class="is-size-7">
                            ¿No tienes cuenta? <a href="register.html" class="has-text-link">Regístrate aquí</a>
                        </p>
                    </div>
                </form>

            </div>
        </div>
    </main>

    <div id="footer-container"></div>

    <script src="../scripts/header.js"></script>
    <script src="../scripts/footer.js"></script>
    <script src="../scripts/scripts.js"></script>
</body>

</html>
