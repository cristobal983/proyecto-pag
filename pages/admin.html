<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - FY.NEW.YORK</title>
  <link rel="stylesheet" href="../styles/estilos.css">
  <style>
    /* Admin specific styles */
    .admin-container {
      max-width: 1200px;
      margin: 40px auto;
      padding: 0 24px;
    }
    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      padding-bottom: 16px;
      border-bottom: 2px solid var(--border-color);
    }
    .admin-title {
      font-size: 28px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: -0.5px;
    }
    .admin-btn-primary {
      background: var(--pink-accent);
      color: #fff;
      border: none;
      padding: 10px 20px;
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .admin-btn-primary:hover {
      background: var(--pink-hover);
    }
    
    .admin-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 40px;
      background: #fff;
      box-shadow: var(--shadow-subtle);
      border-radius: 8px;
      overflow: hidden;
    }
    .admin-table th, .admin-table td {
      padding: 16px;
      text-align: left;
      border-bottom: 1px solid var(--border-color);
    }
    .admin-table th {
      background: #111;
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .admin-table td {
      font-size: 14px;
      color: #333;
    }
    .admin-table img {
      width: 50px;
      height: 50px;
      object-fit: contain;
      background: var(--bg-card);
      border-radius: 4px;
    }
    
    .action-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
      margin-right: 10px;
    }
    .btn-edit { color: #0056b3; }
    .btn-delete { color: #dc3545; }
    
    /* Modal Admin */
    .admin-modal {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
      z-index: 2000;
    }
    .admin-modal.active {
      opacity: 1;
      visibility: visible;
    }
    .admin-modal-content {
      background: #fff;
      width: 90%;
      max-width: 500px;
      padding: 30px;
      border-radius: 8px;
      position: relative;
    }
    .admin-modal-close {
      position: absolute;
      top: 15px; right: 15px;
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
    }
    
    .admin-form-group {
      margin-bottom: 16px;
    }
    .admin-form-group label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .admin-form-group input, .admin-form-group select {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      font-family: inherit;
    }
    .admin-form-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <div id="header-container"></div>

  <main class="admin-container">
    <div class="admin-header">
      <h1 class="admin-title">Panel de Administración</h1>
      <button class="admin-btn-primary" id="btn-add-product">+ Añadir Producto</button>
    </div>

    <table class="admin-table">
      <thead>
        <tr>
          <th>Imagen</th>
          <th>ID</th>
          <th>Nombre</th>
          <th>Marca</th>
          <th>Precio</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="admin-table-body">
        <!-- Generado dinámicamente -->
      </tbody>
    </table>
  </main>

  <div id="footer-container"></div>

  <!-- Modal Añadir/Editar Producto -->
  <div class="admin-modal" id="admin-modal">
    <div class="admin-modal-content">
      <button class="admin-modal-close" id="admin-modal-close">&times;</button>
      <h2 style="margin-bottom: 20px;" id="modal-title">Añadir Producto</h2>
      
      <form id="admin-form">
        <input type="hidden" id="prod-id">
        
        <div class="admin-form-group">
          <label>Nombre del Producto</label>
          <input type="text" id="prod-nombre" required>
        </div>
        
        <div class="admin-form-group">
          <label>Marca</label>
          <select id="prod-marca" required>
            <option value="NIKE">NIKE</option>
            <option value="JORDAN">JORDAN</option>
            <option value="ADIDAS">ADIDAS</option>
            <option value="PUMA">PUMA</option>
            <option value="SALOMON">SALOMON</option>
            <option value="Timberland">Timberland</option>
          </select>
        </div>
        
        <div class="admin-form-group">
          <label>Precio (CLP)</label>
          <input type="number" id="prod-precio" required min="0">
        </div>
        
        <div class="admin-form-group">
          <label>URL de Imagen</label>
          <input type="text" id="prod-imagen" placeholder="../imagenes/ejemplo.jpg" required>
        </div>
        
        <div class="admin-form-group">
          <label>Categoría</label>
          <select id="prod-categoria" required>
            <option value="hombre">Hombre</option>
            <option value="mujer">Mujer</option>
            <option value="unisex">Unisex</option>
            <option value="kids">Kids</option>
          </select>
        </div>

        <div class="admin-form-actions">
          <button type="button" class="admin-btn-primary" style="background: #ccc; color: #333;" id="admin-modal-cancel">Cancelar</button>
          <button type="submit" class="admin-btn-primary">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../components/header.js"></script>
  <script src="../components/footer.js"></script>
  <script src="../scripts/admin.js"></script>
</body>
</html>
